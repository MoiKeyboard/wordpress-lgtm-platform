# =============================================================================
# Edge Reverse Proxy & WordPress FastCGI Server Block
# =============================================================================

# Internal metrics endpoint for Prometheus / Alloy
server {
    listen 8080;
    server_name localhost;
    otel_trace off;
    access_log off;

    location /stub_status {
        stub_status;
    }

    location /healthz {
        return 200 "ok\n";
    }
}

# HTTP (80) -> Redirect all traffic to HTTPS (443)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /healthz {
        otel_trace off;
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (443) -> WordPress & Grafana Reverse Proxy
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # TLS 1.2 / 1.3 Configuration
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Production Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    root /var/www/html;
    index index.php index.html;

    # -------------------------------------------------------------------------
    # Grafana LGTM Dashboard Reverse Proxy (/grafana/)
    # -------------------------------------------------------------------------
    location /grafana/ {
        otel_trace off;
        proxy_pass http://grafana:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # -------------------------------------------------------------------------
    # WordPress Security Rules (Attack Surface Reduction)
    # -------------------------------------------------------------------------
    # Block XML-RPC (amplification DDoS & brute-force vector)
    location = /xmlrpc.php {
        deny all;
        access_log off;
        return 403;
    }

    # Block access to hidden dotfiles (.git, .env, .htaccess)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block direct access to sensitive WordPress files
    location ~* /(?:wp-config\.php|readme\.html|license\.txt)$ {
        deny all;
    }

    # Block PHP execution inside uploads directory
    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }

    # Brute-force rate limiting on /wp-login.php
    location = /wp-login.php {
        limit_req zone=wp_login burst=5 nodelay;
        include fastcgi_params;
        fastcgi_intercept_errors on;
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_TRACEPARENT "00-$otel_trace_id-$otel_span_id-01";
    }

    # -------------------------------------------------------------------------
    # WordPress Routing & Static Asset Caching
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_intercept_errors on;
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        # Propagate W3C Trace Context from Nginx into WordPress PHP-FPM
        fastcgi_param HTTP_TRACEPARENT "00-$otel_trace_id-$otel_span_id-01";
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
    }
}

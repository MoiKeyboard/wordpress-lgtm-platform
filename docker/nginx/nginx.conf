load_module modules/ngx_otel_module.so;

user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  512;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide Nginx version string for security
    server_tokens off;

    # Native OpenTelemetry Exporter to Grafana Alloy
    otel_exporter {
        endpoint alloy:4317;
    }
    otel_service_name nginx-edge-proxy;
    otel_trace on;
    otel_trace_context inject;

    # Structured JSON Access Log with W3C OpenTelemetry trace_id for Loki -> Tempo correlation
    log_format json_otel escape=json
      '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"trace_id":"$otel_trace_id",'
        '"span_id":"$otel_span_id"'
      '}';

    access_log  /var/log/nginx/access.log  json_otel;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    client_max_body_size 32M;

    # Gzip Compression for performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # Brute-force rate limiting zone for /wp-login.php (2 req/sec per IP)
    limit_req_zone $binary_remote_addr zone=wp_login:10m rate=2r/s;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}

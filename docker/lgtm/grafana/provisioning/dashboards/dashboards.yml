apiVersion: 1

providers:
  - name: "WordPress LGTM Production Dashboards"
    orgId: 1
    folder: "Production Observability"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false

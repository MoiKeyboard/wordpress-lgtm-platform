; =============================================================================
; Production PHP & OPcache Optimization for 1GB RAM Instance
; =============================================================================
expose_php = Off
memory_limit = 128M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 60
max_input_vars = 2000

; Security hardening
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
allow_url_include = Off
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

; Bytecode OPcache tuning (eliminates disk I/O for PHP script parsing)
opcache.enable = 1
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
opcache.fast_shutdown = 1

; OpenTelemetry W3C Trace Context + SQL Query Instrumentation
auto_prepend_file = /usr/local/lib/php/otel-wordpress-tracer.php

name: CI - Security Scan, Lint & Build Validation

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: "Gitleaks Secret Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  iac-and-compose-validation:
    name: "Validate Ansible IaC & Docker Compose"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Ansible & YAML Lint Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ansible yamllint

      - name: Validate Ansible Playbook Syntax
        working-directory: ansible
        run: |
          ansible-playbook playbook.yml -i "localhost," --syntax-check

      - name: Validate Docker Compose Schema
        working-directory: docker
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Test Build Custom WordPress OpenTelemetry Image
        working-directory: docker/wordpress
        run: |
          docker build -t wp-platform-otel:ci-test .

  trivy-config-scan:
    name: "Trivy IaC & Misconfiguration Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Config Scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "config"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "0"
